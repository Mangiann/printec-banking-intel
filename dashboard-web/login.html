<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in — Market Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEE0;--card:#FFFDF8;--ink:#16130D;--ink2:#5F594C;--ink3:#928B7B;--line:#E7DDC9;
  --cyan:#23C0E2;--side:#141310;--side-ink:#F5F1E8;--danger:#E2715E}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;
  box-shadow:0 1px 2px rgba(40,33,20,.04),0 18px 50px rgba(20,16,8,.13);width:100%;max-width:386px;padding:36px 32px 30px}
.brand{display:inline-flex;align-items:center;gap:8px;background:var(--side);color:var(--side-ink);
  border-radius:12px;padding:8px 14px;font-weight:800;font-size:15px;letter-spacing:.01em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cyan)}
h1{font-size:19px;margin:20px 0 4px;font-weight:800}
.sub{color:var(--ink2);font-size:13px;margin:0 0 22px;line-height:1.45}
label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 6px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;
  font:inherit;font-size:14px;color:var(--ink)}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(35,192,226,.18)}
button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:var(--side);
  color:var(--side-ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
button:hover{background:#23211c}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-size:12.5px;font-weight:700;margin-top:12px;min-height:16px}
.foot{color:var(--ink3);font-size:11px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <span class="brand"><span class="dot"></span>Printec</span>
  <h1>Market Intelligence</h1>
  <p class="sub">Enter the team password to continue.</p>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
  <button id="btn" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Printec Group · Banking Market Intelligence</div>
</form>
<script>
(function(){
  var f=document.getElementById('f'), pw=document.getElementById('pw'),
      err=document.getElementById('err'), btn=document.getElementById('btn');
  var nx=new URLSearchParams(location.search).get('next')||'/';
  var dest=(nx.charAt(0)==='/'&&nx.charAt(1)!=='/')?nx:'/';   // relative-only (no open redirect)
  f.addEventListener('submit', function(e){
    e.preventDefault(); err.textContent=''; btn.disabled=true;
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:pw.value})})
      .then(function(r){
        if(r.ok){ location.href=dest; return; }
        err.textContent='Incorrect password.'; btn.disabled=false; pw.focus(); pw.select();
      })
      .catch(function(){ err.textContent='Something went wrong — please try again.'; btn.disabled=false; });
  });
})();
</script>
</body>
</html>
