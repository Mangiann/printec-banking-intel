<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Architecture — Printec Market Intelligence</title>
<meta name="description" content="How the Printec banking market-intelligence system works: agents, prompts, scripts and decision flow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
.arch-app{display:flex;flex-direction:column;height:100vh}
/* top bar */
.arch-top{display:flex;align-items:center;gap:16px;padding:11px 20px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);z-index:30;flex-wrap:wrap}
.arch-top .brand{display:flex;align-items:center;gap:11px}
.arch-top .brand img{height:28px;width:auto}
.arch-top .ttl{font-weight:800;font-size:15px;letter-spacing:-.3px}
.arch-top .ttl small{display:block;font-weight:600;font-size:11px;color:var(--ink-2);letter-spacing:0}
.arch-sp{flex:1}
.arch-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.archwho{font-weight:600;font-size:10px;color:var(--ink-2);margin-left:4px}
/* level selector — segmented, like the dashboard toggles */
.arch-controls .seg{display:inline-flex;align-items:center;background:var(--line-2);border-radius:12px;padding:4px;height:42px}
.arch-controls .seg-btn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 16px;border-radius:9px;border:0;background:transparent;cursor:pointer;font:inherit;font-size:13px;font-weight:800;color:var(--ink-2)}
.arch-controls .seg-btn.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,19,16,.12)}
.seg-btn.active .archwho{color:var(--cyan-ink)}
/* zoom cluster — connected dark circles (matches the dashboard's icon group) */
.zoomgrp{display:inline-flex;align-items:center}
.zbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--card);background:var(--side);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:background .15s}
.zoomgrp .zbtn + .zbtn{margin-left:-5px}
.zbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.zbtn:hover{background:#000;position:relative;z-index:3}
.backlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;font-weight:700;font-size:12.5px;background:var(--side);border-radius:var(--pill);padding:0 17px;height:42px;box-shadow:var(--shadow-sm);transition:transform .12s,background .15s}
.backlink:hover{transform:translateY(-1px);background:#23201a}
/* stage */
.arch-stage{position:relative;flex:1;overflow:hidden;cursor:grab;background:radial-gradient(circle at 1px 1px, rgba(120,110,90,.10) 1px, transparent 0) 0 0/26px 26px}
.arch-stage.grabbing{cursor:grabbing}
.arch-world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.arch-edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.arch-legend{position:absolute;left:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:11px 13px;font-size:11px;z-index:20}
.arch-legend h5{margin:0 0 7px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.arch-legend .lg{display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--ink-2);font-weight:600}
.arch-legend .lgi{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.arch-legend .lgi svg{width:14px;height:14px}
.arch-legend .lgd{width:20px;height:20px;flex:none;background:var(--yellow-soft);border:1px solid #ecd99a;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.arch-hint{position:absolute;right:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:9px 13px;font-size:11px;color:var(--ink-2);z-index:20}
.arch-hint b{color:var(--ink)}
.walk-fab{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:25;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 15px;cursor:pointer;box-shadow:var(--shadow-sm)}
.walk-fab:hover{border-color:var(--cyan);color:var(--cyan-ink)}
.loaderc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--ink-2)}
.loaderc .ring{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:aspin 1s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
/* flow-chart nodes (Detailed view) */
.fnode{position:absolute;box-sizing:border-box;cursor:pointer;border-radius:13px;padding:9px 12px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-sm)}
.fnode:hover{filter:brightness(1.03);transform:translateY(-1px)}
.fnode.sel{outline:3px solid var(--cyan);outline-offset:2px}
.fnode .ftext b{display:block;font-size:11.5px;font-weight:800;color:var(--ink);line-height:1.2}
.fnode .ftext span{font-size:9.5px;color:var(--ink-2);line-height:1.3;display:block;margin-top:2px}
.fn-agent{background:var(--cyan-soft);border:1px solid #bfe4f0}
.fn-script{background:var(--lilac-soft);border:1px solid #d3c2ee}
.fn-file{background:var(--card);border:1px dashed #c9bfa8}
.fn-output{background:var(--green-soft);border:1px solid #c2d79a}
.fn-start{background:var(--card-2);border:1px solid var(--line);border-radius:24px;justify-content:center}
.fn-proc{background:var(--card);border:1px solid var(--line)}
.fn-dec{background:var(--yellow-soft);border:1.5px solid #e7c75a;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);justify-content:center;text-align:center;padding:0}
.fn-dec .ftext b{font-size:11px}
.fn-side{opacity:.97}
.fbadge{position:absolute;left:-6px;top:-9px;font-size:8.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:20px;padding:2px 8px;box-shadow:var(--shadow-sm)}
.oconn.flow{stroke:#b9ad92;stroke-width:1.8}
.elabel{position:absolute;font-size:9.5px;font-weight:800;color:var(--ink-2);background:var(--bg);border-radius:6px;padding:1px 6px;z-index:3;pointer-events:none;border:1px solid var(--line)}
.stage-band{position:absolute;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);opacity:.55}
</style>
</head>
<body>
<div class="arch-app">
  <header class="arch-top">
    <div class="brand"><img src="printec-logo.svg" alt="Printec"><div class="ttl">System Architecture<small>How the weekly market-intelligence machine works</small></div></div>
    <div class="arch-sp"></div>
    <div class="arch-controls">
      <div class="seg" id="lvl" role="tablist" aria-label="View level">
        <button type="button" class="seg-btn active" data-lvl="1">Overview <span class="archwho">organogram</span></button>
        <button type="button" class="seg-btn" data-lvl="2">Detailed <span class="archwho">decision flow</span></button>
      </div>
      <div class="zoomgrp" role="group" aria-label="Zoom">
        <button class="zbtn" id="zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="zbtn" id="zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
        <button class="zbtn" id="fit" title="Fit to screen" aria-label="Fit to screen"><svg viewBox="0 0 24 24"><path d="M4 9V6a2 2 0 0 1 2-2h3M20 9V6a2 2 0 0 0-2-2h-3M4 15v3a2 2 0 0 0 2 2h3M20 15v3a2 2 0 0 1-2 2h-3"/></svg></button>
      </div>
      <a class="backlink" href="/" title="Back to the dashboard">← Dashboard</a>
    </div>
  </header>
  <div class="arch-stage" id="stage">
    <div class="arch-world" id="world"><svg class="arch-edges" id="edges"></svg></div>
    <button class="walk-fab" id="walkBtn">ℹ How it works — read the walkthrough</button>
    <div class="loaderc" id="loader"><div class="ring"></div><div>Loading the architecture…</div></div>
    <div class="arch-legend" id="legend" hidden><h5>Legend</h5><div id="legendItems"></div></div>
    <div class="arch-hint" id="hint" hidden><b>Drag</b> to pan · <b>scroll</b> to zoom · <b>click</b> a card for its prompt &amp; details</div>
  </div>
</div>
<script defer src="architecture-data.js"></script>
<script defer src="architecture.js"></script>
</body>
</html>
