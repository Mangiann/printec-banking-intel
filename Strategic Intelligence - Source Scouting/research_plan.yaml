# research_plan.yaml — the source-scouting work queue for Strategic Intelligence: Banking & Payments.
# SET = (country x workstream). Work a few per 5-hour window; each set persists independently, so a
# window cutoff never loses more than the one in-flight run. status: pending | seeded | refresh_due.
# Researches = the fixed workstreams (project description sec.16). Sector is always banking & payments.

workstreams:
  A1: {label: "Disclosures", scope: country, covers: "annual reports, investor decks, earnings, press releases"}
  A2: {label: "Tenders & Procurement", scope: country, covers: "procurement portals, tender/award notices, public contracts"}
  A3: {label: "Regulation & Deadlines", scope: country, covers: "central banks, supervisors, payment regulators, consultations"}
  A4: {label: "Market Statistics", scope: country, covers: "central-bank & card/payment stats, cash/ATM/POS data, adoption"}
  A5: {label: "Early Intent & Jobs", scope: country, covers: "job postings, leadership moves, tech roles, org changes"}
  A6: {label: "Vendors & Competitors", scope: country, covers: "competitor/vendor sites, case studies, partner pages, events"}
  A8: {label: "Futurist & Trends", scope: region/global, covers: "consulting/analyst/policy/academic reports, global trend sources"}

countries:   # Printec operating countries (Austria excluded) — scope for A1-A6
  - {iso: AL, name: "Albania"}
  - {iso: BA, name: "Bosnia & Herzegovina"}
  - {iso: BG, name: "Bulgaria"}
  - {iso: HR, name: "Croatia"}
  - {iso: CY, name: "Cyprus"}
  - {iso: CZ, name: "Czech Republic"}
  - {iso: GR, name: "Greece"}
  - {iso: HU, name: "Hungary"}
  - {iso: XK, name: "Kosovo"}
  - {iso: ME, name: "Montenegro"}
  - {iso: MK, name: "North Macedonia"}
  - {iso: RO, name: "Romania"}
  - {iso: RS, name: "Serbia"}
  - {iso: SK, name: "Slovakia"}
  - {iso: SI, name: "Slovenia"}
  - {iso: UA, name: "Ukraine"}

scopes:   # geographic lenses beyond countries (for A8 trends, EU regulation, global vendors)
  GLOBAL: "Global — worldwide baseline (BIS, World Bank, global consultancies, card schemes)"
  EU: "Europe — EU/EEA regulatory bloc + Western-European leading indicators"
  CEE: "Central & Eastern Europe — Printec's footprint region"
  US: "United States — card / big-tech / regulatory frontier"
  APAC: "Asia-Pacific — real-time / super-app frontier"

